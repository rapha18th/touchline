# Every push and pull request: the engine, live service and vision test suites, the schema contracts, a syntax check of every web
# module, and an image build from the slim staged context with a health check. No Azure login is
# needed anywhere in this file.
name: CI

on:
  push:
    branches: [main, "ws/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Engine and live service tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      # data/ is not in git. Point at an empty folder so no test reads a stale local match.
      TOUCHLINE_DATA: ${{ github.workspace }}/.ci-no-matches
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            services/live/pyproject.toml
            vision/pyproject.toml
      - name: Install engine, live service and vision with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]" -e "./services/live[dev]" -e "./vision[dev]"
      - name: Engine tests
        run: python -m pytest engine -q
      - name: Schema contracts (events and cues of a fresh match against schema/*.schema.json)
        run: python -m pytest services/live/tests/test_contracts.py -v
      - name: Live service tests
        run: python -m pytest services/live -q --ignore=services/live/tests/test_contracts.py
      - name: Vision tests (geometry, flight fits, kick rules, scoring)
        run: python -m pytest vision/tests -q
      - name: Build context staging tests
        run: python -m pytest infra/tests -q

  web:
    name: Web modules parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check on every web/js file
        run: bash scripts/check_js.sh web

  image:
    name: Image builds from the staged context and answers /healthz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage the build context
        # The matches are not in git, so CI stages without them and builds with no seeds: this proves
        # the Dockerfile and infra/stage.py agree, and that the service starts. The deploy stages the
        # three showcase matches from a local data folder.
        run: |
          STAGE=$(python infra/stage.py --allow-missing --out "$RUNNER_TEMP/stage")
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          python -c "import json,sys; m=json.load(open(sys.argv[1])); print(m['files'], 'files', m['bytes'], 'bytes', m['gzip_bytes'], 'gzipped')" "$STAGE/.touchline-stage.json"
      - name: Build
        run: docker build --build-arg SEEDS= -t touchline:ci "$STAGE"
      - name: Run and check /healthz
        run: |
          docker run -d --name tl -p 8080:8080 -e TOUCHLINE_CREW=0 touchline:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker logs tl | tail -40
          exit 1
