[project]
name = "touchline-engine"
version = "0.1.0"
description = "Synthetic, football-realistic matches: events, 25 Hz tracking and a realism report"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["touchline_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
